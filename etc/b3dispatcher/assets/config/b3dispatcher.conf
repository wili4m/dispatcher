##############################################################################################
#Script Name : B3 Dispatcher Tool - SFTP Streamer
#Description : Tool to transfer files between My Company and B3 via SFTP protocol.   
#Author      : Wiliam Freitas
#Email       : wiliamjf@gmail.com
##############################################################################################

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# O modal determina o ambiente. Pode ser crt ou prd.
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Ambiente de Certificacao:
modal="crt"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Cores. As variaveis abaixo atribuem cores na saida de tela do dispatcher.
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Amarelo
ylw="\033[1;93m"

# Vermelho
red="\033[0;91m"

# Verde
grn="\033[1;92m"

# Rosa
pur="\033[1;95m"

# Ciano
cyn="\033[1;96m"

# Reset de cor
nc="\e[0m"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Nomes das tools
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Nome da ferramenta:
tool_name="b3dispatcher"

# Nome do CLI da ferramenta:
cli_name="b3cli"

# Nome da tool para Crontab:
tool_cron_name="b3cron"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Paths dos diretorios do sistema:
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Path da ferramenta:
tool_home="/usr/local/sbin"

# Path absoluto da ferramenta:
tool="${tool_home}/${tool_name}"

# Path absoluto da ferramenta para Crontab
tool_cron="${tool_home}/${tool_cron_name}"

# Path absoluto do cli:
cli="${tool_home}/${cli_name}"

# Path do Assets
assets_home="/usr/local/etc/${tool_name}/assets/"

# Path do arquivo deste arquivo de configuracoes:
config_home="${assets_home}/config/"

# Path dos snippets:
snippets="${assets_home}/snippets"

# Path do arquivo de funcoes. Funcoes eh um arquivo crucial.
functions_home="${assets_home}/properties/"

# Path do storage onde os dados sao fornecidos para a aplicacao:
templates="/b3/fileshare${modal}001"

# Diretorio de entrada. Local onde o Data Factory inputa arquivos:
input_dir="${templates}/00_arquivos_aguardando_validacoes"

# Os diretorio abaixo eh utilizado para alocar arquivos validados:
validation_dir="${templates}/00_arquivos_validados_aguardando_envio_para_a_b3"

# Diretorio para arquivos com falha de validacao de nome:
failed_dir="${templates}/01_arquivos_com_falha_de_validacao_nome_invalido"

# Diretorio para arquivos com falha de validacao de tamanho:
largefiles_dir="${templates}/01_arquivos_com_falha_de_validacao_tamanho_invalido"

# Diretorio de arquivos enviados para a b3 e que aguardando report do processamento
sent_files_waiting_b3_report="${templates}/02_arquivos_enviados_para_b3_aguardando_retorno"

# Diretorio de arquivos enviados para a B3 e processados com reports de falha
sent_files_failure_report_dir="${templates}/02_arquivos_enviados_para_b3_e_processados_com_apontamentos"

# Diretorio de arquivos enviados para a B3 e processados sem reports de falha
sent_files_success_report_dir="${templates}/02_arquivos_enviados_para_b3_e_processados_sem_apontamentos"

# Diretorio de backup dos arquivos enviados para a b3 ha mais de 
backup_dir="${templates}/03_backup"

# Lista de variaveis de diretorios do sistema:
system_dir="${input_dir}, ${validation_dir}, ${failed_dir}, ${largefiles_dir}, ${sent_files_waiting_b3_report}, ${sent_files_failure_report_dir}, ${sent_files_success_report_dir}, ${backup_dir}"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Tratamento de arquivos
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Declare aqui os numeros validos de empresas separandos por virgula. Nao adicione virgula no final:
empresas="01"

#
# Conjunto 1: De acordo com o responsavel pelo tratamento dos dados, esse eh o conjunto de arquivos que dependem um dos outros.
#

# Arquivo de Registro
file_incl_ap="INCL_AP_[1-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9].txt"

# Arquivo de Registro
file_incl_en="INCL_EN_[1-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9].txt"

# Arquivo de Registro
file_incl_mo="INCL_MV_[1-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9].txt"

# Arquivo de Registro
file_incl_si="INCL_SI_[1-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9].txt"

# Arquivo de Registro
file_altr_si="ALTR_SI_[1-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9].txt"

#
# Conjunto 2: De acordo com o responsavel pelo tratamento dos dados, esse eh o outro conjunto de arquivos que dependem um dos outros:
#

# Arquivo de Registro
file_incl_co="INCL_CO_[0-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9].txt"

# Arquivo de Registro
file_incl_mo="INCL_MO_[0-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9].txt"

# Arquivo de Registro
file_incl_pr="INCL_PR_[0-9]*_[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9].txt"

#
# Lista de arquivos ordenados para envio:
#

# Ordem de envio dos arquivos do Conjunto 1:
set1_files_order="${file_incl_apolice}, ${file_incl_endosso}, ${file_incl_movto_premio}, ${file_incl_sinistro}, ${file_altr_sinistro}, ${file_incl_movto_sinis}, ${file_incl_mov_sinistro_salresav},"

# Ordem de envio dos arquivos do Conjunto 2:
set2_files_order="${file_incl_contrato_resseguro}, ${file_incl_mov_premio_resseguro}, ${file_incl_prest_de_conta_resseguro}"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Limites e comportamentos:
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Diretorio de lock do sistema:
lockdir="/var/run/"

# Arquivo de lock:
lockfile="${lockdir}/${tool_name}.lock"

# Mensagem de erro usada na validacao pre-envio. Caso um arquivo possua essa mensagem, sera invalidado:
phrase_error="para este Registro"

# O nome abaixo eh incluido no nome dos arquivos que nao passarem em reprocessamentos por serem iguais a arquivos ja recusados:
invalid_file="INVALIDO"

# Tamanho máximo do arquivo em MB a ser enviado:
maxfilesize="70"

# Intervalo de tempo em minutos para coleta de arquivo de report da B3:
waiting_collect_interval="10"

# Mensagem de erro usada para validar arquivos baixados da B3. Arquivos com essa mensagem serao movidos para o
# diretorio de arquivos enviados, mas com apontamentos da B3. 
phrase_error_report="Erro arquivo"

# Quantidade de dias ate os arquivos enviados serem movidos para o backup:
backup_after="3"

# Modo de envio de arquivos: sequential ou parallel
mode_send_files="sequential"

# Whitelist. Sao mensagens de erro que desconsideramos:
b3_error_msg1="Apólice já cadastrada"
b3_error_msg2="Já existe um endosso registrado com o número informado"
b3_error_msg3="Identificador Movimento já cadastrado"
b3_error_msg4="Sinistro [[0-9]*\] já cadastrado"
b3_error_msg5="Identificador do Movimento de Sinistro já cadastrado"

# Lista de mensagens de erro:
b3_error_whitelist="${b3_error_msg1},${b3_error_msg2},${b3_error_msg3},${b3_error_msg4},${b3_error_msg5}"

# Porta de conexao no FTP da B3:
target_port="9039"

# Diretorio de entrega de arquivos no FTP da B3:
target_path="IN"

# Diretorio de coleta de reports de falha da B3:
reports_path="OUT"

# Path do diretorio de chaves SSH RSA dos usuarios de acesso a B3:
rsakeys_path="${assets_home}/rsakeys"

#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Credenciais de acesso ao FTP B3:
#~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# crt: Empresa 01:
declare crt_target_empresa_01=b3_URL
declare crt_userid_empresa_01=user1
declare crt_rsakey_empresa_01="${rsakeys_path}/id_rsa_user1_crt"

# crt: Empresa 05:
declare crt_target_empresa_05=b3_URL
declare crt_userid_empresa_05=user1
declare crt_rsakey_empresa_05="${rsakeys_path}/id_rsa_user1_crt"

# PRD: Empresa 01:
declare prd_target_empresa_01=b3_URL
declare prd_userid_empresa_01=user1Prd
declare prd_rsakey_empresa_01="${rsakeys_path}/id_rsa_user1Prd"

# PRD: Empresa 05:
declare prd_target_empresa_05=b3_URL
declare prd_userid_empresa_05=user2Prd
declare prd_rsakey_empresa_05="${rsakeys_path}/id_rsa_user2Prd"
